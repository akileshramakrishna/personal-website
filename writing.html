<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Akilesh Ramakrishna</title>
  <meta name="description" content="Essays and reflections by Akilesh Ramakrishna.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <aside class="sidebar">
    <a class="sidebar__name" href="index.html"><img class="sidebar__logo" src="sketch_transparent.png" alt="">Akilesh Ramakrishna</a>
    <nav class="sidebar__nav">
      <a href="writing.html" class="active">Writing</a>
      <a href="photos.html">Photos</a>
      <a href="books.html">Books</a>
      <a href="newsletter.html">Newsletter</a>
      <a href="about.html">About</a>
    </nav>
    <div class="sidebar__bottom">
      <div class="sidebar__label">— writing</div>
      <div class="sidebar__filters" id="filters">
        <button class="filter-link active" data-cat="all">All</button>
        <button class="filter-link" data-cat="reflections">Reflections</button>
        <button class="filter-link" data-cat="photos">Photos</button>
        <button class="filter-link" data-cat="climate">Impact and Climate</button>
        <button class="filter-link" data-cat="other">Other Posts</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main__inner" id="articles"></div>
  </main>

  <script>
    /* ============================================================
       ADD ARTICLES HERE — newest first.
       cat: 'reflections' | 'photos' | 'climate' | 'other'
       cover: optional image path (shows a 72x48 thumbnail)
       ============================================================ */
    const ARTICLES = [
      {
        title: 'Perspectives from New York Climate Week 2026',
        date: 'September 2026', year: 2026, cat: 'climate',
        href: 'climate-week-nyc-2026.html',
        excerpt: "An expansive NYCW 2026 hearing perspectives from across corners of our world on its seemingly simultaneous march towards progress and doom.",
        cover: 'climate-asia-society.jpg'
      },
      {
        title: 'Eternal Eyes',
        date: 'August 2026', year: 2026, cat: 'reflections',
        href: 'eternal-eyes.html',
        excerpt: "When we look upon with eyes of reverence, He's revealed in the details. Whispers embedded in sands of time.",
        cover: 'golden-temple-night.jpg'
      },
      {
        title: 'Eldred Beacon',
        date: 'August 2026', year: 2026, cat: 'reflections',
        href: 'eldred-beacon.html',
        excerpt: "As if destiny and fate collided — and here you are. An infinitesimal grain. To begin from within while the world chases without.",
        cover: 'lighthouse.jpg'
      },
      {
        title: 'On Journaling',
        date: 'May 2026', year: 2026, cat: 'reflections',
        href: 'on-journaling.html',
        excerpt: "The practical purpose of journaling is to capture the thoughts and emotions of our day. The ethical purpose to reflect on how the events have moved us and formed our thinking.",
        cover: null
      },
    ];

    const CAT_LABEL = { reflections: 'Reflections', photos: 'Photos', climate: 'Impact and Climate', other: 'Other Posts' };

    const wrap = document.getElementById('articles');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

    function render() {
      const years = [...new Set(ARTICLES.map(a => a.year))].sort((a, b) => b - a);
      wrap.innerHTML = years.map(year => {
        const rows = ARTICLES.filter(a => a.year === year).map(a => `
          <article class="article" data-cat="${a.cat}">
            <div class="article__meta">
              <div class="article__date">${esc(a.date)}</div>
              <div class="article__cat">${esc(CAT_LABEL[a.cat] || '')}</div>
            </div>
            ${a.cover ? `<img class="article__thumb" src="${esc(a.cover)}" alt="">` : ''}
            <div class="article__body">
              <a class="article__title" href="${esc(a.href)}">${esc(a.title)}</a>
              <div class="article__excerpt">${esc(a.excerpt)}</div>
            </div>
          </article>`).join('');
        return `<div class="year-divider">${year}</div>${rows}`;
      }).join('');
    }

    // ── Filters (year labels always remain visible) ──
    const filters = document.getElementById('filters');
    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-link');
      if (!btn) return;
      const cat = btn.dataset.cat;
      filters.querySelectorAll('.filter-link').forEach(b => b.classList.toggle('active', b === btn));
      wrap.querySelectorAll('.article').forEach(row => {
        row.style.display = (cat === 'all' || row.dataset.cat === cat) ? '' : 'none';
      });
    });

    render();
  </script>
</body>
</html>
