<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books — Akilesh Ramakrishna</title>
  <meta name="description" content="Books and reading recommendations by Akilesh Ramakrishna.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <aside class="sidebar">
    <a class="sidebar__name" href="index.html"><img class="sidebar__logo" src="sketch_transparent.png" alt="">Akilesh Ramakrishna</a>
    <nav class="sidebar__nav">
      <a href="writing.html">Writing</a>
      <a href="photos.html">Photos</a>
      <a href="books.html" class="active">Books</a>
      <a href="newsletter.html">Newsletter</a>
      <a href="about.html">About</a>
    </nav>
    <div class="sidebar__bottom">
      <div class="sidebar__label">— books</div>
      <div class="sidebar__filters" id="filters">
        <button class="filter-link active" data-genre="all">All</button>
        <button class="filter-link" data-genre="fiction">Fiction</button>
        <button class="filter-link" data-genre="nonfiction">Non-fiction</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main__inner" id="content"></div>
  </main>

  <script>
    /* ============================================================
       ADD BOOKS HERE.
       genre   : 'fiction' | 'nonfiction'
       section : 'reading'  (currently reading)  OR  a year number
       isbn    : Open Library cover lookup (-M.jpg). Omit if none.
       cover   : optional full URL override (used instead of isbn)
       fav     : true for a year's favourite (shows a small dot)
       ============================================================ */
    const BOOKS = [
      // Currently reading
      { title: 'Gora', author: 'Rabindranath Tagore', genre: 'fiction', section: 'reading', cover: 'https://ia903203.us.archive.org/view_archive.php?archive=/7/items/covers_0010/covers_0010_95.zip&file=0010954609.jpg' },
      { title: 'Models of the Mind', author: 'Grace Lindsay', genre: 'nonfiction', section: 'reading', isbn: '9781472966421' },

      // 2026
      { title: 'When We Cease to Understand the World', author: 'Benjamín Labatut', genre: 'fiction', section: 2026, cover: 'covers/labatut.jpg' },
      { title: 'Go Tell It on the Mountain', author: 'James Baldwin', genre: 'fiction', section: 2026, isbn: '9780375701870' },
      { title: 'Flesh', author: 'David Szalay', genre: 'fiction', section: 2026, cover: 'covers/szalay.jpg' },
      { title: 'The Hungry Tide', author: 'Amitav Ghosh', genre: 'fiction', section: 2026, isbn: '9780618711666' },
      { title: 'Wanting', author: 'Luke Burgis', genre: 'nonfiction', section: 2026, cover: 'covers/burgis.jpg' },
      { title: 'The Snow Leopard', author: 'Peter Matthiessen', genre: 'nonfiction', section: 2026, cover: 'covers/snow-leopard.jpg' },
      { title: 'The Tree Where Man Was Born', author: 'Peter Matthiessen', genre: 'nonfiction', section: 2026, cover: 'covers/tree-man-born.jpg' },
      { title: 'The End of Average', author: 'Todd Rose', genre: 'nonfiction', section: 2026, isbn: '9780062358363' },

      // 2025
      { title: 'Brave New World', author: 'Aldous Huxley', genre: 'fiction', section: 2025, isbn: '9780060850524', fav: true },
      { title: 'Life of Pi', author: 'Yann Martel', genre: 'fiction', section: 2025, cover: 'covers/martel.jpg' },
      { title: 'Narcissus and Goldmund', author: 'Hermann Hesse', genre: 'fiction', section: 2025, cover: 'covers/hesse.jpg' },
      { title: 'Ministry for the Future', author: 'Kim Stanley Robinson', genre: 'fiction', section: 2025, isbn: '9780316300131' },
      { title: 'Loneliness of Sonia and Sunny', author: 'Kiran Desai', genre: 'fiction', section: 2025, cover: 'covers/desai.jpg' },
      { title: 'Storyteller', author: 'Mario Vargas Llosa', genre: 'fiction', section: 2025, cover: 'covers/llosa.jpg' },
      { title: 'Marginlands', author: 'Arati Kumar-Rao', genre: 'nonfiction', section: 2025, cover: 'covers/rao.jpg', fav: true },
      { title: 'Slow Productivity', author: 'Cal Newport', genre: 'nonfiction', section: 2025, cover: 'covers/newport.jpg' },
      { title: 'Sapiens', author: 'Yuval Noah Harari', genre: 'nonfiction', section: 2025, isbn: '9780062316097' },
      { title: 'Thinking, Fast and Slow', author: 'Daniel Kahneman', genre: 'nonfiction', section: 2025, isbn: '9780374533557' },
      { title: 'When Breath Becomes Air', author: 'Paul Kalanithi', genre: 'nonfiction', section: 2025, isbn: '9780812988406' },
      { title: 'Skin in the Game', author: 'Nassim Nicholas Taleb', genre: 'nonfiction', section: 2025, isbn: '9780425284629' },
      { title: 'The Autobiography of Malcolm X', author: 'Malcolm X & Alex Haley', genre: 'nonfiction', section: 2025, cover: 'covers/malcolmx.jpg' },
      { title: 'The Key Man', author: 'Simon Clark & Will Louch', genre: 'nonfiction', section: 2025, cover: 'covers/keyman.jpg' },
      { title: 'Amphibious Soul', author: 'Craig Foster', genre: 'nonfiction', section: 2025, cover: 'covers/foster.jpg' },
    ];

    const GENRE_LABEL = { fiction: 'Fiction', nonfiction: 'Non-fiction' };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    const coverURL = b => b.cover || (b.isbn ? `https://covers.openlibrary.org/b/isbn/${b.isbn}-M.jpg` : null);

    function coverEl(b, cls) {
      const url = coverURL(b);
      return url
        ? `<img class="${cls}" src="${esc(url)}" alt="${esc(b.title)} cover" loading="lazy">`
        : `<div class="${cls} book__cover--ph">${esc(b.title)}</div>`;
    }

    function bookCard(b) {
      return `
        <div class="book" data-genre="${b.genre}">
          ${b.fav ? '<div class="book__dot" title="Favourite"></div>' : ''}
          ${coverEl(b, 'book__cover')}
          <div class="book__title">${esc(b.title)}</div>
          <div class="book__author">${esc(b.author)}</div>
        </div>`;
    }

    function genreBlock(books, genre) {
      const list = books.filter(b => b.genre === genre);
      if (!list.length) return '';
      return `
        <div class="genre-block" data-genre="${genre}">
          <div class="genre-label">${GENRE_LABEL[genre]}<span class="rule"></span></div>
          <div class="book-grid">${list.map(bookCard).join('')}</div>
        </div>`;
    }

    function render() {
      const content = document.getElementById('content');
      let html = '';

      // Currently reading
      const reading = BOOKS.filter(b => b.section === 'reading');
      if (reading.length) {
        html += `
          <div class="section-block">
            <div class="section-label">Currently Reading</div>
            <div class="reading-grid">
              ${reading.map(b => `
                <div class="read-card" data-genre="${b.genre}">
                  ${coverEl(b, 'read-card__cover')}
                  <div>
                    <div class="read-card__genre">${GENRE_LABEL[b.genre]}</div>
                    <div class="read-card__title">${esc(b.title)}</div>
                    <div class="read-card__author">by ${esc(b.author)}</div>
                  </div>
                </div>`).join('')}
            </div>
          </div>`;
      }

      // Years descending
      const years = [...new Set(BOOKS.filter(b => typeof b.section === 'number').map(b => b.section))].sort((a, b) => b - a);
      years.forEach(year => {
        const yearBooks = BOOKS.filter(b => b.section === year);
        html += `
          <div class="year-block">
            <div class="year-head"><span class="year-head__label">${year}</span><span class="rule"></span></div>
            ${genreBlock(yearBooks, 'fiction')}
            ${genreBlock(yearBooks, 'nonfiction')}
          </div>`;
      });

      content.innerHTML = html;
    }

    // ── Filter: Fiction / Non-fiction / All ──
    const filters = document.getElementById('filters');
    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-link');
      if (!btn) return;
      const g = btn.dataset.genre;
      filters.querySelectorAll('.filter-link').forEach(b => b.classList.toggle('active', b === btn));
      // Hide whole genre sub-sections (label + grid) and reading cards that don't match
      document.querySelectorAll('.genre-block').forEach(el => {
        el.style.display = (g === 'all' || el.dataset.genre === g) ? '' : 'none';
      });
      document.querySelectorAll('.read-card').forEach(el => {
        el.style.display = (g === 'all' || el.dataset.genre === g) ? '' : 'none';
      });
    });

    render();
  </script>
</body>
</html>
